[workspace]
resolver = "2"
members = [
    "crates/kovanica-types",
    "crates/kovanica-keys",
    "crates/kovanica-tx",
    "crates/kovanica-rpc",
    "crates/kovanica-fee",
    "crates/kovanica-dex",
    "crates/kovanica-airdrop",
    "crates/kovanica-bridge",
    "crates/kovanica-merchant",
    "crates/kovanica-relayer",
    "crates/kovanica-sdk",
    "bindings/kovanica-wasm",
]
default-members = [
    "crates/kovanica-sdk",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KovanicaDAG/kovanica"
homepage = "https://kovanica.online"
authors = ["Kovanica Contributors"]
keywords = ["blockchain", "kovanica", "blockdag", "utxo", "wallet"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

[workspace.dependencies]
# Internal
kovanica-types = { path = "crates/kovanica-types", version = "0.1.0-alpha.1" }
kovanica-keys  = { path = "crates/kovanica-keys",  version = "0.1.0-alpha.1" }
kovanica-tx    = { path = "crates/kovanica-tx",    version = "0.1.0-alpha.1" }
kovanica-rpc   = { path = "crates/kovanica-rpc",   version = "0.1.0-alpha.1" }
kovanica-fee   = { path = "crates/kovanica-fee",   version = "0.1.0-alpha.1" }
kovanica-dex   = { path = "crates/kovanica-dex",   version = "0.4.0" }
kovanica-airdrop = { path = "crates/kovanica-airdrop", version = "0.4.0" }
kovanica-bridge  = { path = "crates/kovanica-bridge",  version = "0.4.0" }
kovanica-merchant = { path = "crates/kovanica-merchant", version = "0.4.0" }
kovanica-relayer = { path = "crates/kovanica-relayer", version = "0.4.0" }

# External — pin carefully; freeze before 1.0.0
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
anyhow     = "1"
hex        = "0.4"
sha2       = "0.10"
hmac       = "0.12"
pbkdf2     = "0.12"
bip39      = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand       = "0.8"
zeroize    = { version = "1", features = ["derive"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
bs58       = "0.5"
blake3     = "1"
tracing    = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
url        = "2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["futures-sink", "futures-io"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
