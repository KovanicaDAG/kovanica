# KovanicaWallet iOS Project Configuration for xcodegen
# Generate with: xcodegen generate --spec mobile/ios/xcodegen.yml

name: KovanicaWallet
options:
  bundleIdPrefix: com.kovanica
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  settings:
    base:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""  # Set in Xcode or via env
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0.0"
      INFOPLIST_FILE: KovanicaWallet/Info.plist
      SWIFT_EMIT_LOC_STRINGS: YES
    debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

packages:
  KeychainSwift:
    url: https://github.com/evgenyneu/keychain-swift
    from: "24.0.0"
  BIP39Swift:
    url: https://github.com/bitmark-inc/bip39swift
    from: "1.0.0"
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto
    from: "3.0.0"

targets:
  KovanicaWallet:
    type: application
    platform: iOS
    sources:
      - path: KovanicaWallet
    resources:
      - path: KovanicaWallet/Assets.xcassets
      - path: KovanicaWallet/Preview Content
    dependencies:
      - package: KeychainSwift
      - package: BIP39Swift
      - package: SwiftCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovanica.wallet
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "['UIInterfaceOrientationPortrait']"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kovanica Wallet uses Face ID to secure your wallet."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kovanica Wallet needs camera access to scan QR codes."
    scheme:
      testTargets: [KovanicaWalletTests]
      gatherCoverageData: true
      codeCoverageTargets:
        - KovanicaWallet

  KovanicaWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KovanicaWalletTests
    dependencies:
      - target: KovanicaWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovanica.wallet.tests

schemes:
  KovanicaWallet:
    build:
      targets:
        KovanicaWallet: all
        KovanicaWalletTests: test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug