# Kovanica Protocol — Docker Compose
#
# Quick start: docker compose up -d

services:
  kovanica-node:
    build:
      context: ../..
      dockerfile: kovanica-install/docker/Dockerfile
    container_name: kovanica-node
    restart: unless-stopped
    ports:
      - "9000:9000"    # P2P
      - "8080:8080"    # HTTP/API
    volumes:
      - kovanica-data:/var/lib/kovanica
    environment:
      - KOVANICA_DATA=/var/lib/kovanica
      - KOVANICA_P2P_PORT=9000
      - KOVANICA_HTTP_PORT=8080
      - KOVANICA_PEERS=seed.kovanica.online:9000,seed2.kovanica.online:9000
      - KOVANICA_MINE=0
      - KOVANICA_MINE_SECS=60
      - KOVANICA_EXPLORER=0
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/head"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Prometheus metrics scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: kovanica-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  # Optional: Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: kovanica-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=kovanica

volumes:
  kovanica-data:
  prometheus-data:
  grafana-data:
