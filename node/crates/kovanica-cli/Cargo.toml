[package]
name = "kovanica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line client for the Kovanica (KVNC) testnet BlockDAG"

[lib]
name = "kovanica_cli"
path = "src/lib.rs"

[[bin]]
name = "kovanica"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ureq = "2"
serde_json = "1"
hex.workspace = true
getrandom.workspace = true
anyhow = "1"
kovanica-state = { path = "../kovanica-state" }
bip39 = { version = "2", features = ["rand", "std"] }

[lints.rust]
unsafe_code = "forbid"
