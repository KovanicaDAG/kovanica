[package]
name = "kovanica-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line client for the Kovanica (KVNC) testnet BlockDAG"

[lib]
name = "kovanica_cli"
path = "src/lib.rs"

[[bin]]
name = "kovanica"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ureq.workspace = true
serde_json.workspace = true
hex.workspace = true
getrandom.workspace = true
anyhow.workspace = true
kovanica-state = { path = "../kovanica-state" }
bip39 = { workspace = true, features = ["rand", "std"] }

[lints.rust]
unsafe_code = "forbid"
