[package]
name = "kvnc-lightnode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kovanica light node: seal sync and transfers, no consensus loop"

[lib]
name = "kvnc_lightnode"
path = "src/lib.rs"

[[bin]]
name = "kvnc-lightnode"
path = "src/main.rs"

[dependencies]
kvnc-types = { path = "../kvnc-types" }
kvnc-crypto = { path = "../kvnc-crypto" }
kvnc-light = { path = "../kvnc-light" }
kvnc-keystore = { path = "../kvnc-keystore" }
kvnc-staking = { path = "../kvnc-staking" }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
hex = { workspace = true }
bincode = { workspace = true }
zeroize = "1"
