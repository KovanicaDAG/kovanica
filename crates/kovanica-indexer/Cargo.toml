[package]
name = "kovanica-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Event/log indexer + WebSocket push service for Kovanica"

[[bin]]
name = "kovanica-indexer"
path = "src/main.rs"

[dependencies]
kovanica-types = { path = "../kovanica-types" }
kovanica-common = { path = "../kovanica-common" }
kovanica-execution = { path = "../kovanica-execution" }
kovanica-storage = { path = "../kovanica-storage" }
kovanica-crypto = { path = "../kovanica-crypto" }

axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
toml = "0.8"
redb = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = "0.24"
