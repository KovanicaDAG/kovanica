[package]
name = "kovanica-wallet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared pure-Rust wallet logic for Kovanica CLI and mobile"

[dependencies]
kovanica-types = { path = "../kovanica-types" }
kovanica-crypto = { path = "../kovanica-crypto" }
kovanica-keystore = { path = "../kovanica-keystore" }
kovanica-hw-signer = { path = "../kovanica-hw-signer", optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
argon2 = "0.6"
chacha20poly1305 = "0.10"
rand = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
zeroize = { workspace = true }
bip39 = { version = "3", features = ["zeroize"] }

[features]
default = []
hw-signer = ["dep:kovanica-hw-signer"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3.8"
