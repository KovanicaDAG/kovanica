[package]
name = "kovanica-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Load generation and performance benchmark helpers for Kovanica post-reset soak (optional, offline-safe)"

[[bin]]
name = "kovanica-bench"
path = "src/bin/main.rs"

[dependencies]
kovanica-sdk = { path = "../kovanica-sdk", default-features = false, features = ["http"] }
kovanica-types = { path = "../kovanica-types" }
kovanica-crypto = { path = "../kovanica-crypto" }
clap = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

[dev-dependencies]
