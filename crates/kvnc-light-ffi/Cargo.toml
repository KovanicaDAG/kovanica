[package]
name = "kvnc-light-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI bindings for the Kovanica light client"

[lib]
name = "kvnc_light_ffi"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
kvnc-types = { path = "../kvnc-types" }
kvnc-crypto = { path = "../kvnc-crypto" }
kvnc-light = { path = "../kvnc-light" }
kvnc-keystore = { path = "../kvnc-keystore" }
kvnc-comms-core = { path = "../kvnc-comms-core" }
kvnc-comms-crypto = { path = "../kvnc-comms-crypto" }
kvnc-comms-relay = { path = "../kvnc-comms-relay", default-features = false }
# §7.2 registry slot: single source of truth for the contract storage key.
# Both are mobile-safe (no std-only / network deps; `kvnc-common` pulls only
# blake3, already in the tree via `kvnc-crypto`).
kvnc-common = { path = "../kvnc-common" }
kvnc-name-registry = { path = "../kvnc-name-registry" }
uniffi = { version = "=0.32.0" }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
zeroize = "1"

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "kvnc-light-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
