[package]
name = "kovanica-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Command-line client for the Kovanica (KVNC) testnet BlockDAG"
repository = "https://github.com/KovanicaDAG/kovanica-cli"

[lib]
name = "kovanica_cli"
path = "src/lib.rs"

[[bin]]
name = "kovanica"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ureq = "2"
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
anyhow = "1"
kovanica-state = { path = "/root/kovanica/protocol/crates/kovanica-state" }
bip39 = { version = "2", features = ["rand", "std"] }
ratatui = "0.29.0"
crossterm = "0.29.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"