# .github/workflows/web-deploy.yml
# Cloudflare Pages Deployment for KVNC Explorer

name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/api-client/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: |
          cd packages/web
          npm ci

      - name: Build web application
        run: |
          cd packages/web
          npm run build
        env:
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL_PROD }}
          VITE_CHAIN_ID: ${{ secrets.VITE_CHAIN_ID_PROD }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kvnc-explorer
          directory: packages/web/dist
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'