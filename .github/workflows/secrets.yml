name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Nightly full-history scan over every ref

env:
  GITLEAKS_VERSION: "8.24.3"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the scan below sees every commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # `gitleaks git` scans commits; it replaced `gitleaks detect`, which is a
      # deprecated alias. `--log-opts` is passed straight to `git log`, so it
      # must be a real git option: `--all-history` is not one, and gitleaks
      # would report a "partial scan" of 0 bytes and exit non-zero without
      # scanning anything. `--all` (every ref) and no flag (HEAD history) are
      # the two valid choices.
      - name: Run gitleaks (all refs nightly, checked-out history on push/PR)
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            gitleaks git --config .gitleaks.toml --log-opts="--all" --redact --no-banner --exit-code 1
          else
            gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1
          fi
