name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Nightly full-history scan

env:
  GITLEAKS_VERSION: "8.24.3"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for --log-opts=--all-history
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks (full history on schedule, diff on PR/push)
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ./gitleaks detect --config .gitleaks.toml --log-opts="--all-history" --redact --exit-code 1
          else
            ./gitleaks detect --config .gitleaks.toml --redact --exit-code 1
          fi