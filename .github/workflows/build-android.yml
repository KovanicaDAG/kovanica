name: Build Android

on:
  push:
    branches: [main]
    paths:
      - 'protocol/crates/kovanica-ffi/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'protocol/crates/kovanica-ffi/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-aar:
    name: Build AAR (kovanica-ffi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: protocol/crates/kovanica-ffi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r27c
          cache-key: ${{ runner.os }}-android-ndk-r27c

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            protocol/crates/kovanica-ffi/target
            protocol/crates/kovanica-ffi/android/src/main/jniLibs
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build AAR (both ABIs)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          chmod +x ./build-android.sh
          ./build-android.sh

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: kovanica-ffi-aar
          path: protocol/crates/kovanica-ffi/android/
          if-no-files-found: error
          retention-days: 7
