name: Release node desktop

# Builds the Kovanica Node desktop installers (Windows NSIS, Linux .deb +
# AppImage). The app is a Tauri shell around the real `kovanica-node` binary,
# which is bundled as a sidecar, so each job:
#
#   1. builds `kovanica-node` from this commit,
#   2. stages it as a Tauri sidecar for the target triple,
#   3. refuses to continue unless the staged binary reproduces the live
#      chain-4 network tag,
#   4. bundles the frontend + sidecar and uploads the installer.
#
#   git tag v0.1.0-node-desktop && git push origin v0.1.0-node-desktop
#
# This workflow is independent of release-node.yml: it does not publish or
# rename the headless server assets (`kovanica-node-*-linux.tar.gz`), and the
# server path stays on node/scripts/install.sh.

on:
  push:
    tags: ["v*-node-desktop"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Live public testnet (chain 4). Every published installer must contain a
  # node that reproduces this tag; see docs/TESTNET-RESET.md.
  EXPECTED_NETWORK_TAG: "4-0eacd5699210b145"

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust (version from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build kovanica-node
        run: cargo build --release --locked -p kovanica-node

      - name: Stage the node sidecar
        run: |
          set -eu
          mkdir -p apps/node-desktop/src-tauri/binaries
          install -m 0755 target/release/kovanica-node \
            "apps/node-desktop/src-tauri/binaries/kovanica-node-${{ matrix.triple }}"
          ls -l apps/node-desktop/src-tauri/binaries/

      - name: Check the network tag against the published chain-4 bundle
        run: |
          set -eu
          work="$RUNNER_TEMP/tagcheck"
          rm -rf "$work"
          mkdir -p "$work/data"
          cp testnet/chain4/genesis_validators.toml \
             testnet/chain4/founder_premine.hex \
             testnet/chain4/funded_accounts.toml "$work/data/"
          cat >"$work/kovanica.toml" <<EOF
          chain_id = 4
          data_dir = "$work/data"
          run_validator = false
          rpc_addr = "127.0.0.1"
          rpc_port = 8545
          bootnodes = []
          round_duration_ms = 4000
          EOF
          tag="$(target/release/kovanica-node network-tag --config "$work/kovanica.toml")"
          echo "network tag: $tag (expected $EXPECTED_NETWORK_TAG)"
          if [ "$tag" != "$EXPECTED_NETWORK_TAG" ]; then
            echo "::error::network tag $tag does not match the live testnet; the installer would ship a node that cannot peer with the mesh"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: apps/node-desktop
        run: |
          set -eu
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build the desktop bundle
        working-directory: apps/node-desktop
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: node-desktop-linux
          path: |
            apps/node-desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/node-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (version from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build kovanica-node
        run: cargo build --release --locked -p kovanica-node

      - name: Stage the node sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/node-desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/kovanica-node.exe apps/node-desktop/src-tauri/binaries/kovanica-node-x86_64-pc-windows-msvc.exe
          Get-ChildItem apps/node-desktop/src-tauri/binaries

      - name: Check the network tag against the published chain-4 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "tagcheck"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          $data = Join-Path $work "data"
          New-Item -ItemType Directory -Force $data | Out-Null
          Copy-Item @(
            "testnet/chain4/genesis_validators.toml",
            "testnet/chain4/founder_premine.hex",
            "testnet/chain4/funded_accounts.toml"
          ) $data
          # TOML basic strings treat backslash as an escape, so hand the node a
          # forward-slash path.
          $dataToml = $data -replace '\\', '/'
          $cfg = Join-Path $work "kovanica.toml"
          $content = @"
          chain_id = 4
          data_dir = "$dataToml"
          run_validator = false
          rpc_addr = "127.0.0.1"
          rpc_port = 8545
          bootnodes = []
          round_duration_ms = 4000
          "@
          Set-Content -Path $cfg -Value $content -Encoding utf8
          $tag = ((& target/release/kovanica-node.exe network-tag --config $cfg) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::kovanica-node network-tag failed"
            exit 1
          }
          Write-Host "network tag: $tag (expected $env:EXPECTED_NETWORK_TAG)"
          if ($tag -ne $env:EXPECTED_NETWORK_TAG) {
            Write-Host "::error::network tag $tag does not match the live testnet; the installer would ship a node that cannot peer with the mesh"
            exit 1
          }

      - name: Install frontend dependencies
        working-directory: apps/node-desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the desktop bundle
        working-directory: apps/node-desktop
        shell: pwsh
        run: |
          npx tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: node-desktop-windows
          path: apps/node-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          # Strip the `./` that `sha256sum ./*` puts in front of each name so
          # the checksum list carries bare asset names.
          shopt -s nullglob
          assets=(./*.deb ./*.AppImage ./*-setup.exe)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no desktop installers were downloaded; nothing to checksum"
            exit 1
          fi
          sha256sum "${assets[@]}" | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kovanica Node desktop ${GITHUB_REF_NAME%-node-desktop}" \
            --notes "$(cat <<'EOF'
          Kovanica Node desktop shell for the public Kovanica testnet (chain 4).

          | Asset | Target |
          |---|---|
          | `*-setup.exe` | Windows installer, per-user (no administrator rights) |
          | `*.deb` | Linux x86_64 Debian/Ubuntu package |
          | `*.AppImage` | Linux x86_64 portable AppImage |
          | `SHA256SUMS` | checksums for all assets above |

          The app bundles the real `kovanica-node` binary as a sidecar and
          supervises it: it does not reimplement the node, and on first start it
          writes a chain-4 config, copies the chain-4 genesis files and follows
          the public testnet. It does not run as a validator out of the box.

          Every job fails unless the bundled node reproduces the live network
          tag `4-0eacd5699210b145`, so an installer whose node could not peer
          with the mesh is never published.

          Installing a server / headless node is a different path: use
          `node/scripts/install.sh` in the repository (also served at
          https://kovanica.online/download/install.sh). Docs:
          https://docs.kovanica.online
          EOF
          )"
