name: Secret scan

# Why this exists
# ---------------
# On 2026-09-26 three PoA authority *signing secrets* were found committed in
# plaintext in this repository, which is PUBLIC. They entered via `96e9225`
# ("chore(testnet): add real authority keys + generation example for PoA
# reset") and were mirrored across `protocol/TESTNET_AUTHORITY_KEYS.md`,
# `protocol/docs/TESTNET_AUTHORITY_KEYS.md`,
# `protocol/docs/TESTNET_RESET_PROCEDURE.md` and several vault-mirror paths.
# One of them was live in a systemd unit on a public seed at the time. With a
# threshold of 2 of 3, that is enough to forge authority-signed blocks for the
# entire set. All three are burned; PR #64 redacted the working tree.
#
# This workflow deliberately does NOT baseline them. Baselining would require
# writing either the secret values or a fingerprint of them into the repo, and
# it would silently permit any *future* secret in the same files. The scan is
# RANGE-SCOPED to the commits an event introduces, so pre-existing findings
# cannot mask new ones. (gitleaks reads only *added* lines from a commit range,
# so the commit that *removes* a secret does not re-introduce it.)
#
# This is a backstop, not the primary control. The primary control is that
# `generate_authority_keys` (#53) writes secrets only to mode-0600 files and
# never to stdout. Do not paste a key into a doc, a unit file committed to a
# repo, a PR body, or a chat message.
#
# Why the gitleaks CLI and not `gitleaks/gitleaks-action`
# -------------------------------------------------------
# The v2 action refuses to scan `pull_request` events without a `GITHUB_TOKEN`
# input (`🛑 GITHUB_TOKEN is now required to scan pull requests`), and its
# `args` input is not a valid input at all in that version. Running the
# CLI directly removes both problems and, more importantly, lets us tell a
# real finding (exit 1) apart from a broken scanner (any other non-zero) —
# the previous `if: failure()` reported a missing-token tool error as
# "a secret was detected", which is how this job sat red on every PR while
# scanning nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (changed commits only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history needed for range resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (version pinned)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Keep the canonical release filename: `sha256sum -c` resolves the
          # paths *inside* checksums.txt, so the file on disk must carry the
          # name the manifest uses.
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "${base}/${archive}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve the commit range this event introduced
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Scan everything this PR adds, including commits pushed after the
            # PR was opened.
            echo "log_opts=--log-opts=${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=--log-opts=${BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch, or the first push to an empty history.
            echo "log_opts=" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved range: '$(sed -n 's/^log_opts=//p' "$GITHUB_OUTPUT")' (empty = full history)"

      - name: Scan
        id: scan
        env:
          RANGE: ${{ steps.range.outputs.log_opts }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          gitleaks detect --redact --verbose --no-banner --config .gitleaks.toml ${RANGE}
          rc=$?
          case "$rc" in
            0)
              echo "outcome=clean" >> "$GITHUB_OUTPUT"
              echo "::notice::gitleaks: no secrets in the scanned range."
              ;;
            1)
              echo "outcome=found" >> "$GITHUB_OUTPUT"
              echo "::error::gitleaks found secret(s) in the commits this event introduced. Values are redacted in the log above."
              ;;
            *)
              echo "outcome=broken" >> "$GITHUB_OUTPUT"
              echo "::error::gitleaks exited ${rc} — the SCANNER failed. This is not a finding; treat the result as unknown until it runs clean."
              ;;
          esac
          exit 0

      - name: Enforce
        if: steps.scan.outputs.outcome == 'found' || steps.scan.outputs.outcome == 'broken'
        run: |
          set -euo pipefail
          outcome="${{ steps.scan.outputs.outcome }}"
          if [ "$outcome" = "found" ]; then
            echo "::error::A secret was detected in the commits introduced by this event."
            echo "::error::If this is a false positive, add a narrowly-scoped .gitleaksignore"
            echo "::error::entry — never a path-wide allowlist and never the secret itself."
            echo "::error::If it is real: treat the key as burned, rotate it, and purge it."
          else
            echo "::error::The secret scanner did not complete. Fix the scanner before"
            echo "::error::trusting a green run — a broken gate is not a passing gate."
          fi
          exit 1
