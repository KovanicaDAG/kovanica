name: Secret scan

# Why this exists
# ---------------
# On 2026-09-26 three PoA authority *signing secrets* were found committed in
# plaintext in this repository, which is PUBLIC. They entered via `96e9225`
# ("chore(testnet): add real authority keys + generation example for PoA
# reset") and were mirrored across `protocol/TESTNET_AUTHORITY_KEYS.md`,
# `protocol/docs/TESTNET_AUTHORITY_KEYS.md`,
# `protocol/docs/TESTNET_RESET_PROCEDURE.md` and several vault-mirror paths.
# One of them was live in a systemd unit on a public seed at the time.
#
# Those keys are burned and are being purged from history in a separate change.
# This workflow deliberately does NOT baseline them: baselining would require
# writing either the secret values or a fingerprint of them into the repo, and
# it would silently permit any *future* secret in the same files. Instead the
# scan is RANGE-SCOPED to the commits an event introduces, so pre-existing
# findings cannot mask new ones.
#
# This is a backstop, not the primary control. The primary control is that
# `generate_authority_keys` (#53) writes secrets only to mode-0600 files and
# never to stdout. Do not paste a key into a doc, a unit file committed to a
# repo, a PR body, or a chat message.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (changed commits only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history needed for range resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the commit range this event introduced
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Scan everything this PR adds, including commits that landed on
            # the branch after the first push.
            echo "log_opts=--log-opts=${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=--log-opts=${BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch, or the first push to an empty history.
            echo "log_opts=" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved range: '$(cat "$GITHUB_OUTPUT" | sed -n 's/^log_opts=//p')' (empty = full history)"

      - name: Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_REPORT_FORMAT: sarif
          # The range is supplied here and NOT in `args`, so the flag is passed
          # exactly once. gitleaks reads GITLEAKS_LOG_OPTS itself.
          GITLEAKS_LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        with:
          args: detect --redact --verbose --no-banner

      - name: Fail if a secret was found
        if: failure()
        run: |
          echo "::error::A secret was detected in the commits introduced by this event."
          echo "::error::If this is a false positive, add a narrowly-scoped .gitleaksignore"
          echo "::error::entry — never a path-wide allowlist and never the secret itself."
          echo "::error::If it is real: treat the key as burned, rotate it, and purge it."
          exit 1
