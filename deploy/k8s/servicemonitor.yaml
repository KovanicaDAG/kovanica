apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kovanica-metrics
  labels:
    app.kubernetes.io/name: kovanica
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kovanica
      app.kubernetes.io/component: rpc
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
