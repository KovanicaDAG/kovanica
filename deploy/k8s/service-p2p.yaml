apiVersion: v1
kind: Service
metadata:
  name: kovanica-p2p-headless
  labels:
    app.kubernetes.io/name: kovanica
    app.kubernetes.io/component: p2p
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kovanica
    app.kubernetes.io/component: node
  ports:
    - name: p2p
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kovanica-p2p
  labels:
    app.kubernetes.io/name: kovanica
    app.kubernetes.io/component: p2p
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kovanica
    app.kubernetes.io/component: node
  ports:
    - name: p2p
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
