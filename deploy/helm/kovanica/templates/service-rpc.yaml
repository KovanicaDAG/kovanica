apiVersion: v1
kind: Service
metadata:
  name: {{ include "kovanica.fullname" . }}-rpc
  labels:
    {{- include "kovanica.labels" . | nindent 4 }}
    app.kubernetes.io/component: rpc
spec:
  type: {{ .Values.service.rpc.type }}
  selector:
    {{- include "kovanica.selectorLabels" . | nindent 4 }}
  ports:
    - name: rpc
      port: {{ .Values.service.rpc.port }}
      targetPort: rpc
      protocol: TCP
    - name: ws
      port: {{ .Values.service.ws.port }}
      targetPort: ws
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
