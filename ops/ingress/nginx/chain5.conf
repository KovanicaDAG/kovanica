# Nginx configuration for Kovanica Chain 5 Hybrid PoW Testnet
# Serves JSON-RPC, WebSocket subscriptions, health/metrics, and faucet API.

# Map allowed origins for CORS
map $http_origin $cors_origin {
    default "*";
    "~^https?://.*kovanica\.online$" "$http_origin";
    "~^https?://.*kovanica\.org$" "$http_origin";
    "~^http://localhost(:[0-9]+)?$" "$http_origin";
    "~^http://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate limit zone for RPC and faucet endpoints
limit_req_zone $binary_remote_addr zone=chain5_rpc_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=chain5_faucet_limit:10m rate=5r/m;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name testnet5.kovanica.online testnet5.kovanica.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Chain 5 RPC, Observer, and Faucet API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testnet5.kovanica.online testnet5.kovanica.org;

    ssl_certificate /etc/letsencrypt/live/testnet5.kovanica.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet5.kovanica.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Prometheus metrics endpoint
    location = /metrics {
        proxy_pass http://127.0.0.1:8545/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check
    location = /health {
        include /etc/nginx/snippets/kovanica-cors.conf;
        proxy_pass http://127.0.0.1:8545/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Faucet API proxy
    location /faucet {
        limit_req zone=chain5_faucet_limit burst=10 nodelay;
        include /etc/nginx/snippets/kovanica-cors.conf;

        proxy_pass http://127.0.0.1:3000/faucet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON-RPC root and /rpc endpoint (routed to node1 RPC)
    location / {
        limit_req zone=chain5_rpc_limit burst=100 nodelay;
        include /etc/nginx/snippets/kovanica-cors.conf;

        # Support POST to / directly
        if ($request_method = POST) {
            rewrite ^/$ /rpc break;
        }

        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Dedicated Observer RPC endpoint (unburdened by PoW mining)
    location /observer/ {
        limit_req zone=chain5_rpc_limit burst=100 nodelay;
        include /etc/nginx/snippets/kovanica-cors.conf;

        rewrite ^/observer/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8548;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
