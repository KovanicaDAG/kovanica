# Chaos / fault-injection workflow
#
# This workflow is **opt-in only** — it is NOT triggered on PRs or pushes.
# It runs on a schedule (nightly) and via manual `workflow_dispatch`.
#
# What it exercises:
# 1. Mid-commit SIGKILL + restart convergence (chaos_kill_mid_commit test)
# 2. Network partition/latency via tc/netem (ops/chaos/netem.sh) — only if `tc` is available.
#
# Requirements:
# - GitHub-hosted runners generally DO NOT have `tc` (no CAP_NET_ADMIN).
#   The netem step detects this and gracefully skips with a clear message.
# - Requires the release binary to be built (debug build trips a debug_assert!
#   on the restart path — see test docs).
# - Test is flaky by nature (real processes, real sockets, real timing).
#   It is intentionally `@ignore`d and gated here.

name: chaos / fault-injection

on:
  workflow_dispatch:
    inputs:
      test_type:
        type: choice
        description: "Which chaos test to run"
        options:
          - kill-mid-commit
          - netem-partition
          - both
        default: "both"
      use_release:
        type: boolean
        description: "Build and use release binary (required for kill-mid-commit)"
        default: true

  schedule:
    # Nightly at 03:17 UTC — avoids peak CI load.
    - cron: '17 3 * * *'

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kill-mid-commit:
    name: Mid-commit SIGKILL + restart
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.test_type == 'kill-mid-commit' || inputs.test_type == 'both') || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        if: ${{ inputs.use_release || github.event_name == 'schedule' }}
        run: cargo build --release -p kovanica-node

      - name: Run kill-mid-commit test
        env:
          KOVANICA_NODE_BINARY: ${{ github.workspace }}/target/release/kovanica-node
          RUST_BACKTRACE: 1
        run: |
          cargo test -p kovanica-node --test chaos_kill_mid_commit -- --ignored --nocapture

  netem-partition:
    name: Netem partition / latency / loss
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.test_type == 'netem-partition' || inputs.test_type == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for tc (CAP_NET_ADMIN)
        id: tc_check
        run: |
          if command -v tc >/dev/null 2>&1 && tc qdisc add dev lo root netem loss 0% 2>/dev/null; then
            tc qdisc del dev lo root 2>/dev/null || true
            echo "tc_available=true" >> $GITHUB_OUTPUT
          else
            echo "tc_available=false" >> $GITHUB_OUTPUT
            echo "::warning::tc not available or no CAP_NET_ADMIN — netem test will be skipped"
          fi

      - name: Run netem test (only if tc available)
        if: ${{ steps.tc_check.outputs.tc_available == 'true' }}
        run: |
          bash ops/chaos/netem.sh --test-partition --duration 30 --loss 10 --latency 50ms

      - name: Skip notice (tc not available)
        if: ${{ steps.tc_check.outputs.tc_available == 'false' }}
        run: |
          echo "Skipping netem test: runner lacks tc/CAP_NET_ADMIN"
          exit 0