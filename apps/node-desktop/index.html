<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kovanica Node</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <h1>Kovanica Node</h1>
          <p class="muted">0.1.0 · chain 4 (testnet)</p>
        </div>
      </header>

      <section class="panel" aria-labelledby="node-status-heading">
        <h2 id="node-status-heading">Node Status</h2>
        <dl id="status" class="readout"></dl>
      </section>

      <section class="panel" aria-labelledby="validator-heading">
        <h2 id="validator-heading">Validator Mode</h2>
        <label class="toggle-switch">
          <input type="checkbox" id="validator-toggle" disabled />
          <span class="toggle-slider"></span>
          <span>Run as a validator. There is no maximum. A 50,000 KUNA self-stake is required.</span>
        </label>
        <p id="validator-status" class="muted" hidden>
          <span id="validator-stake-value">0</span> KUNA stake
          <span id="validator-shortfall" hidden>(<span id="validator-shortfall-value">0</span> KUNA shortfall)</span>
        </p>
        <button id="stake-button" disabled class="stake-btn">
          Stake (add missing KUNA)
        </button>
      </section>

      <section class="panel" aria-labelledby="logs-heading">
        <h2 id="logs-heading">Logs (last 200 lines)</h2>
        <div id="log-viewer" class="log-viewer"></div>
      </section>

      <section class="panel" aria-labelledby="actions-heading">
        <h2 id="actions-heading">Actions</h2>
        <div class="action-row">
          <button id="start-button" class="primary-btn">Start</button>
          <button id="stop-button" disabled>Stop</button>
        </div>
        <p id="keep-running-checkbox">
          <input type="checkbox" id="keep-running" />
          <label for="keep-running">Keep running after close</label>
        </p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
