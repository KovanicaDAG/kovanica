[package]
name = "kovanica-node-desktop"
version = "0.1.0"
description = "Kovanica Node desktop app"
authors = ["Kovanica Team"]
edition = "2021"
license = "Apache-2.0"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["process", "sync", "time", "rt", "macros", "net"] }
zeroize = { version = "1", features = ["serde"] }
bincode = "1.3"
hex = "0.4"
anyhow = "1"
thiserror = "1"
kovanica-keystore = { path = "../../../crates/kovanica-keystore" }
kovanica-types = { path = "../../../crates/kovanica-types" }
kovanica-crypto = { path = "../../../crates/kovanica-crypto" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
